<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה פיננסי</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">משיכת נתונים היסטוריים</h1>
        
        <form id="financeForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">סימול מניה (Ticker)</label>
                <input type="text" id="ticker" placeholder="למשל: AAPL" required class="w-full px-4 py-2 border border-slate-300 rounded-lg uppercase">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">תאריך התחלה</label>
                <input type="date" id="startDate" required class="w-full px-4 py-2 border border-slate-300 rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">תאריך סיום</label>
                <input type="date" id="endDate" required class="w-full px-4 py-2 border border-slate-300 rounded-lg">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700">
                משוך נתונים לגיליון
            </button>
        </form>

        <div id="statusArea" class="mt-6 text-center hidden">
            <div id="loading" class="flex justify-center items-center text-slate-600">
                <span class="font-medium italic">מעבד בקשה, אנא המתן...</span>
            </div>
            <div id="message" class="mt-2 p-3 rounded-lg text-sm font-bold hidden"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('financeForm');
        const webAppUrl = 'https://script.google.com/macros/s/AKfycbzNewAr1JaEnQt0u3o15pADnDyQYWtJ83Z5SMLrdyPRTE0IyGc_FSUviteGx_pFDo2n5Q/exec';

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('message').classList.add('hidden');
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.style.opacity = '0.5';

            const payload = {
                ticker: document.getElementById('ticker').value.toUpperCase(),
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value
            };

            // שליחה בפורמט טקסט רגיל עוקפת בעיות אבטחה של דפדפנים מול גוגל
            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors', 
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain' }
            })
            .then(() => {
                document.getElementById('loading').classList.add('hidden');
                const msg = document.getElementById('message');
                msg.textContent = 'הבקשה נשלחה! בדוק את הגיליון בעוד מספר שניות.';
                msg.className = 'mt-2 p-3 rounded-lg text-sm font-bold bg-green-100 text-green-700';
                msg.classList.remove('hidden');
                btn.disabled = false;
                btn.style.opacity = '1';
            })
            .catch(err => {
                alert('שגיאה: ' + err);
                btn.disabled = false;
                btn.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
