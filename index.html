<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה פיננסי</title>
    <!-- ייבוא ספריית Tailwind CSS לעיצוב מהיר ומודרני -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* הגדרת גופן בסיסי למראה נקי */
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- המכולה (Container) המרכזית של הטופס - מעוצבת כ"כרטיס" צף -->
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">משיכת נתונים היסטוריים</h1>
        
        <form id="financeForm" class="space-y-5">
            
            <!-- שדה קלט: סימול מניה -->
            <div>
                <label for="ticker" class="block text-sm font-semibold text-slate-700 mb-1">סימול מניה (Ticker)</label>
                <input type="text" id="ticker" name="ticker" placeholder="למשל: AAPL" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 uppercase transition-colors">
            </div>

            <!-- שדה קלט: תאריך התחלה -->
            <div>
                <label for="startDate" class="block text-sm font-semibold text-slate-700 mb-1">תאריך התחלה</label>
                <input type="date" id="startDate" name="startDate" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-colors">
            </div>

            <!-- שדה קלט: תאריך סיום -->
            <div>
                <label for="endDate" class="block text-sm font-semibold text-slate-700 mb-1">תאריך סיום</label>
                <input type="date" id="endDate" name="endDate" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-colors">
            </div>

            <!-- כפתור השליחה -->
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 active:bg-blue-800 transition duration-200 mt-6 shadow-sm">
                משוך נתונים לגיליון
            </button>

        </form>

        <!-- אזור חיווי למשתמש (יוצג רק בעת טעינה או לאחר קבלת תשובה) -->
        <div id="statusArea" class="mt-6 text-center hidden">
            
            <!-- אנימציית טעינה (ספינר) + טקסט -->
            <div id="loading" class="hidden flex justify-center items-center text-slate-600">
                <svg class="animate-spin -ml-1 ml-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="font-medium">טוען נתונים, אנא המתן...</span>
            </div>
            
            <!-- הודעת מערכת (הצלחה או שגיאה) -->
            <div id="message" class="hidden p-3 rounded-lg text-sm font-bold"></div>
            
        </div>
    </div>

    <script>
        // תפיסת האלמנטים מתוך ה-HTML כדי שנוכל לשלוט בהם דרך הקוד
        const form = document.getElementById('financeForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusArea = document.getElementById('statusArea');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');

        // הגדרת מאזין לפעולת "שליחה" (Submit) של הטופס
        form.addEventListener('submit', function(e) {
            
            // 1. מניעת רענון הדף האוטומטי (ברירת המחדל של טפסים בדפדפן)
            e.preventDefault();

            // 2. הכנת הממשק למצב טעינה
            statusArea.classList.remove('hidden'); // חשיפת אזור החיווי
            loading.classList.remove('hidden');    // חשיפת הספינר
            loading.classList.add('flex');         // סידור הספינר והטקסט בשורה
            message.classList.add('hidden');       // הסתרת הודעות קודמות (אם היו)
            
            // נטרול כפתור השליחה כדי למנוע מהמשתמש ללחוץ שוב ושוב בזמן ההמתנה
            submitBtn.disabled = true; 
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // 3. איסוף הערכים שהמשתמש הזין בשדות
            // משתמשים ב-toUpperCase כדי לוודא ששם המניה תמיד באותיות גדולות (למשל aapl יהפוך ל-AAPL)
            const tickerValue = document.getElementById('ticker').value.toUpperCase();
            const startDateValue = document.getElementById('startDate').value;
            const endDateValue = document.getElementById('endDate').value;

            // 4. אריזת הנתונים לתוך אובייקט מסודר שמוכן להמרה ל-JSON
            const requestData = {
                ticker: tickerValue,
                startDate: startDateValue,
                endDate: endDateValue
            };

            // 5. הגדרת הכתובת של שרת היעד (כאן תדביק את הכתובת של ה-Google Apps Script שלך)
            const webAppUrl = 'https://script.google.com/macros/s/AKfycbxARO77goQ1lNlqazZtq4QCYBVE2eGWi2KNIK3t4Dl0yTAA5RzoarO83uR7z568T_aSog/exec';

            // ביצוע פניית הרשת (Fetch) מסוג POST
            fetch(webAppUrl, {
                method: 'POST',
                // הפיכת אובייקט הנתונים שלנו למחרוזת JSON כדי שנוכל לשלוח אותו על גבי הרשת
                body: JSON.stringify(requestData)
            })
            .then(response => {
                // בדיקה ראשונית: האם השרת ענה לנו שהכל בסדר?
                if (!response.ok) {
                    throw new Error('שגיאת רשת מול השרת.');
                }
                // אם הכל בסדר, אנחנו מבקשים לפענח את התשובה (שחוזרת כ-JSON)
                return response.json(); 
            })
            .then(data => {
                // 6. טיפול במצב של הצלחה (הנתונים הגיעו והכל עבר חלק)
                loading.classList.remove('flex');
                loading.classList.add('hidden'); // העלמת הספינר
                
                // עיצוב והצגת הודעת ההצלחה (ירוק)
                message.className = 'p-3 rounded-lg text-sm font-bold bg-green-100 text-green-700';
                message.textContent = 'הנתונים נמשכו ונשמרו בגיליון בהצלחה!';
                message.classList.remove('hidden');
                
                // אופציונלי: אפשר לאפס את השדות בטופס לאחר הצלחה
                // form.reset();
            })
            .catch(error => {
                // 7. טיפול במצב של שגיאה (האינטרנט התנתק, הכתובת שגויה, או שגיאה בשרת)
                loading.classList.remove('flex');
                loading.classList.add('hidden'); // העלמת הספינר
                
                // עיצוב והצגת הודעת השגיאה (אדום)
                message.className = 'p-3 rounded-lg text-sm font-bold bg-red-100 text-red-700';
                message.textContent = 'אירעה שגיאה: ' + error.message;
                message.classList.remove('hidden');
            })
            .finally(() => {
                // 8. פעולת סיום - מתבצעת תמיד, גם בהצלחה וגם בשגיאה
                // מחזירים את כפתור השליחה למצב פעיל כדי שהמשתמש יוכל לנסות שוב
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            });
        });
    </script>
</body>
</html>
